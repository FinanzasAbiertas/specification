name: Update Swagger UI

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  updateSwagger:
    runs-on: ubuntu-latest
    
    # Permisos necesarios para leer, escribir y crear PRs nativamente
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Get Latest Swagger UI Release
        id: swagger-ui
        run: |
          release_tag=$(curl -sL https://api.github.com/repos/swagger-api/swagger-ui/releases/latest | jq -r ".tag_name")
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          
          if [ -f swagger-ui.version ]; then
            current_tag=$(<swagger-ui.version)
          else
            current_tag="v0.0.0"
          fi
          echo "current_tag=$current_tag" >> $GITHUB_OUTPUT

      - name: Update Swagger UI
        if: steps.swagger-ui.outputs.current_tag != steps.swagger-ui.outputs.release_tag
        env:
          RELEASE_TAG: ${{ steps.swagger-ui.outputs.release_tag }}
          SWAGGER_YAML: "swagger.yaml"
        run: |
          # Delete the dist directory and index.html
          rm -fr dist index.html          
          
          # Download the release as a zip file
          curl -sL -o swagger-ui.zip https://github.com/swagger-api/swagger-ui/archive/refs/tags/$RELEASE_TAG.zip
          
          # Extract the zip file quietly
          unzip -q swagger-ui.zip
          
          # Move the dist directory to root and then move index.html out to root
          cp -Rf swagger-ui-*/dist .
          cp -Rf dist/index.html .
          
          # Clean up the downloaded zip and temporary extracted folder
          rm swagger-ui.zip
          rm -fr swagger-ui-*
          
          # Fix references in dist/ and index.html
          find dist/ -type f -name "*.js" -exec sed -i "s|https://petstore.swagger.io/v2/swagger.json|$SWAGGER_YAML|g" {} +
          sed -i "s|href=\"./|href=\"dist/|g" index.html
          sed -i "s|src=\"./|src=\"dist/|g" index.html
          sed -i "s|href=\"index|href=\"dist/index|g" index.html
          
          # Update current release version file
          echo ${{ steps.swagger-ui.outputs.release_tag }} > swagger-ui.version

      - name: Create Pull Request Natively
        if: steps.swagger-ui.outputs.current_tag != steps.swagger-ui.outputs.release_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.swagger-ui.outputs.release_tag }}
        run: |
          # Configurar identidad de git para el bot de acciones
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Definir el nombre de la rama
          BRANCH_NAME="swagger-ui-updates-$RELEASE_TAG"

          # Verificar si hay cambios reales en el repositorio
          git status
          if [ -z "$(git status --porcelain)" ]; then
            echo "No hay cambios para actualizar."
            exit 0
          fi

          # Crear rama y subir cambios
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "Update swagger-ui to $RELEASE_TAG"
          git push origin "$BRANCH_NAME" --force

          # Crear el Pull Request usando la GitHub CLI (gh)
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Update SwaggerUI to $RELEASE_TAG" \
            --body "Updates [swagger-ui](https://github.com/swagger-api/swagger-ui) to $RELEASE_TAG.

            Auto-generated by GitHub Actions." \
            --label "dependencies,automated pr"
